<h2>Jot 0.2.0 · 换张纸，换个心情</h2><ul><li>新增八种便签外观：默认、方格手账、奶油贴纸、荧光清单、薄荷花园、樱花信笺、复古稿纸、海盐蓝调。</li><li>右下角皮肤卡片向上展开，悬停即时预览，点击选定；移开或 Esc 恢复，不改写正文。</li><li>离线中文手写文楷、系统字体与宋体，支持深浅外观和装饰开关。</li><li>置顶移到右上角，加强深色选中态；小窗口主题列表可滚动。</li></ul><p>支持 macOS 14+、Apple 芯片与 Intel。本机旧便签与设置继续兼容。当前仍为未经 Apple Developer ID 签名及 Apple 公证的预览版。</p>
